<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            width: 200px;
            height: 250px;
            border: 1px solid lightgrey;
            perspective: 600px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition:transform 1s;   
            transform-style: preserve-3d;
        }
        .face {
            position: absolute;
            height: 100%;
            width: 100%;
            backface-visibility: hidden;
            text-align: center;
        }
        .front {
            background-color: green;
        }
        .back {
            background: red;
            transform: rotateY(180deg);
        }
        .container:hover .card {
            transform: rotateY(180deg);
        }
        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>CSS CARD FLIP</h1>
    <div class="container">
        <div class="card">
    <div class="face front"><h2>Front</h2></div>
    <div class="face back"><h2>Back</h2></div>
            </div>
        </div>
    
</body>

</html>
